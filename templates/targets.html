{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Targets</h1>
    <div class="sub">Programs configured for analysis.</div>
  </div>
  <div class="row">
    <label class="search" style="width: 240px;">
      <i class="bi bi-search"></i>
      <input id="q" class="input" type="search" placeholder="Search targets…  ( / )" autocomplete="off">
    </label>
    <a class="btn btn-primary" href="/new"><i class="bi bi-plus-lg"></i>New target</a>
  </div>
</div>

<div class="card">
  <table class="table">
    <thead>
      <tr><th>Name</th><th>Status</th><th class="nowrap">Inputs</th><th>Arch</th><th class="nowrap">Last updated</th></tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="5" class="muted">Loading…</td></tr>
    </tbody>
  </table>
  <div class="empty" id="empty" hidden><i class="bi bi-search"></i><h3>No targets match</h3></div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  var tbody = document.getElementById('rows'), q = document.getElementById('q'), empty = document.getElementById('empty');
  var targets = [];
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function status(t) {
    if (t.results === null) return '<span class="badge">Not analyzed</span>';
    var out = [];
    if (t.violations) out.push('<span class="badge v-violation"><span class="dot"></span>' + t.violations + ' violation' + (t.violations === 1 ? '' : 's') + '</span>');
    if (t.review) out.push('<span class="badge v-review"><span class="dot"></span>' + t.review + ' to review</span>');
    if (!out.length) out.push('<span class="badge b-green"><i class="bi bi-check2"></i>' + (t.results ? 'No violations' : 'No results') + '</span>');
    return '<div class="row" style="gap:6px">' + out.join('') + '<span class="muted small">' + t.results + ' total</span></div>';
  }
  function render() {
    var s = q.value.trim().toLowerCase();
    var list = targets.filter(function (t) { return !s || t.filename.toLowerCase().indexOf(s) >= 0; });
    tbody.innerHTML = list.map(function (t) {
      var href = '/target?name=' + encodeURIComponent(t.id);
      return '<tr class="link" data-href="' + href + '">' +
        '<td><a href="' + href + '"><strong>' + esc(t.filename) + '</strong></a></td>' +
        '<td>' + status(t) + '</td>' +
        '<td class="muted">' + esc(t.inputs) + '</td>' +
        '<td class="mono small text-2">' + esc(t.arch) + '</td>' +
        '<td class="muted small nowrap">' + esc(t.updated) + '</td></tr>';
    }).join('');
    empty.hidden = list.length > 0;
  }
  tbody.addEventListener('click', function (e) {
    var tr = e.target.closest('tr[data-href]');
    if (tr && !e.target.closest('a')) location.href = tr.dataset.href;
  });
  q.addEventListener('input', render);
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && !e.target.matches('input, textarea')) { e.preventDefault(); q.focus(); }
  });
  hy2Get('/api/targets').then(function (r) { targets = r.data; render(); })
    .catch(function (err) { tbody.innerHTML = '<tr><td colspan="5" class="muted">Failed to load targets: ' + esc(err.message) + '</td></tr>'; });
})();
</script>
{% endblock %}
