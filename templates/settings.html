{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>Settings</h1></div></div>
<form class="card" action="/api/settings" method="post" style="max-width: 640px;">
  <div class="card-body">
    <label class="field">
      <span class="label">Max depth (static analysis)</span>
      <input class="input" type="number" min="0" name="maxdepth" value="{{ data.max_depth }}" style="max-width: 160px;">
    </label>
    <label class="switch">
      <input type="checkbox" name="toggleinfeasible" {{ 'checked' if data.toggle_infeasible == 'True' }}>
      <span class="track"></span>
      <span>
        <strong style="font-weight: 500;">Hide infeasible results</strong><br>
        <span class="muted small">Results the solver proved unsatisfiable are left out of result lists.</span>
      </span>
    </label>
  </div>
  <div class="card-head" style="border-top: 1px solid var(--border); border-bottom: 0; justify-content: flex-end;">
    <button class="btn btn-primary" type="submit">Save settings</button>
  </div>
</form>
{% endblock %}
